name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: pip install -r requirements-dev.txt
      - name: Unit + integration tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build
      - name: Start container (extractive mode, no API key)
        run: |
          echo "LLM_PROVIDER=extractive" > .env
          docker compose up -d
      - name: Wait for healthcheck
        run: |
          for i in $(seq 1 36); do
            status=$(docker inspect -f '{{.State.Health.Status}}' docusense-api 2>/dev/null || echo starting)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          exit 1
      - name: Smoke test
        run: bash scripts/smoke_test.sh http://localhost:8000
      - name: Container logs
        if: always()
        run: docker compose logs && docker compose down
